<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · Minimal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
                   'Microsoft YaHei', sans-serif;
      background: #fafafa;
      color: #111;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* 极简卡片：无边框、无阴影，仅靠留白与细线 */
    .login-card {
      width: 100%;
      max-width: 360px;
      text-align: center;
    }

    /* 品牌区 */
    .brand {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 2px;
      margin-bottom: 48px;
    }
    .brand span { font-weight: 300; color: #999; }

    /* 表单 */
    .field {
      margin-bottom: 28px;
      text-align: left;
    }
    .field label {
      display: block;
      font-size: 12px;
      color: #888;
      letter-spacing: 1px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .field input {
      width: 100%;
      border: none;
      border-bottom: 1px solid #ddd;
      background: transparent;
      padding: 10px 0;
      font-size: 15px;
      color: #111;
      outline: none;
      transition: border-color .25s ease;
    }
    .field input:focus { border-bottom-color: #111; }
    .field input::placeholder { color: #ccc; }

    /* 提交按钮 */
    .submit {
      width: 100%;
      margin-top: 36px;
      padding: 14px 0;
      background: #111;
      color: #fff;
      border: none;
      font-size: 14px;
      letter-spacing: 3px;
      cursor: pointer;
      transition: opacity .25s ease;
    }
    .submit:hover { opacity: .85; }

    /* 底部链接 */
    .links {
      margin-top: 28px;
      font-size: 13px;
      color: #999;
    }
    .links a {
      color: #111;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color .25s ease;
    }
    .links a:hover { border-bottom-color: #111; }
    .links .divider { margin: 0 12px; color: #ddd; }
  </style>
</head>
<body>
  <div class="login-card">
    <!-- 品牌 -->
    <div class="brand">MINIMAL<span>.</span></div>

    <!-- 表单 -->
    <form onsubmit="return false;">
      <div class="field">
        <label for="email">邮箱</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button type="submit" class="submit">登 录</button>
    </form>

    <!-- 辅助链接 -->
    <div class="links">
      <a href="#">忘记密码</a>
      <span class="divider">|</span>
      <a href="#">注册账号</a>
    </div>
  </div>
</body>
</html>
