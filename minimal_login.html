<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>极简登录</title>
  <style>
    /* ===== 极简风格：大量留白、细线、克制配色、无多余装饰 ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #fafafa;
      color: #111;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      width: 100%;
      max-width: 360px;
      padding: 48px 32px;
      background: #fff;
      border: 1px solid #eee;
    }

    /* 品牌区 */
    .brand {
      text-align: center;
      margin-bottom: 40px;
    }
    .brand .logo {
      font-size: 28px;
      font-weight: 300;
      letter-spacing: 6px;
      color: #111;
    }
    .brand .sub {
      margin-top: 8px;
      font-size: 13px;
      color: #999;
      letter-spacing: 1px;
    }

    /* 表单 */
    .field { margin-bottom: 24px; }
    .field label {
      display: block;
      font-size: 12px;
      color: #666;
      letter-spacing: 1px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .field input {
      width: 100%;
      padding: 10px 0;
      font-size: 15px;
      color: #111;
      background: transparent;
      border: none;
      border-bottom: 1px solid #ddd;
      outline: none;
      transition: border-color .2s;
    }
    .field input:focus { border-bottom-color: #111; }
    .field input::placeholder { color: #bbb; }

    /* 按钮 */
    .btn-login {
      width: 100%;
      padding: 12px 0;
      margin-top: 12px;
      font-size: 14px;
      letter-spacing: 3px;
      color: #fff;
      background: #111;
      border: none;
      cursor: pointer;
      transition: opacity .2s;
    }
    .btn-login:hover { opacity: .85; }

    /* 底部链接 */
    .links {
      margin-top: 24px;
      display: flex;
      justify-content: space-between;
      font-size: 13px;
    }
    .links a {
      color: #888;
      text-decoration: none;
      transition: color .2s;
    }
    .links a:hover { color: #111; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand">
      <div class="logo">MINIMAL</div>
      <div class="sub">SIGN IN TO CONTINUE</div>
    </div>

    <form onsubmit="event.preventDefault(); alert('登录成功');">
      <div class="field">
        <label for="username">用户名</label>
        <input type="text" id="username" placeholder="请输入用户名" autocomplete="username">
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
      </div>
      <button type="submit" class="btn-login">登 录</button>
    </form>

    <div class="links">
      <a href="#">忘记密码</a>
      <a href="#">注册账号</a>
    </div>
  </div>
</body>
</html>
