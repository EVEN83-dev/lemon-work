<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lemon Ocean — 3D Ocean Wallpaper</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0f; }
    #canvas { width: 100%; height: 100%; display: block; }
    #loading {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: rgba(255,255,255,0.7); font: 14px/1.4 system-ui, sans-serif;
      letter-spacing: 2px; pointer-events: none; transition: opacity 0.6s;
    }
    #error {
      position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
      color: rgba(255, 107, 107, 0.75); font: 12px/1.4 system-ui, sans-serif;
      text-align: center; display: none; padding: 10px 18px;
      background: rgba(0, 0, 0, 0.35); border-radius: 20px;
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
      letter-spacing: 0.5px; pointer-events: none; transition: opacity 1s;
    }
    #flash {
      position: absolute; inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(255, 250, 220, 0.55), rgba(255, 245, 200, 0.22));
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.08s ease-out;
      mix-blend-mode: screen;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="loading">LOADING OCEAN...</div>
  <div id="error"></div>
  <div id="flash"></div>

  <!-- ★ 使用 UMD 版 Three.js，避免 iframe + file:// 协议下 ES Module 加载失败 -->
  <script src="./libs/three/three.min.js?v=14"></script>
  <script src="ocean.js?v=14"></script>
</body>
</html>
