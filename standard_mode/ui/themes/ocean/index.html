<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000510">
  <title>Three.js TSL Ocean Dynamic Wallpaper</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    #canvas-container { position: fixed; inset: 0; z-index: 0; }
    canvas { display: block; width: 100%; height: 100%; }

    #loading, #error {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #000510; color: #e1f5fe; text-align: center;
      transition: opacity 0.5s ease; pointer-events: none;
    }
    #loading { pointer-events: auto; }
    #loading.hidden, #error.hidden { opacity: 0; }
    #error { background: #1a0505; color: #ff9e9e; display: none; }
    #error:not(.hidden) { display: flex; pointer-events: auto; }
    .spinner {
      width: 48px; height: 48px; margin-bottom: 18px;
      border: 3px solid rgba(255,255,255,0.12); border-top-color: #4fc3f7; border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #ui {
      display: none; /* 壁纸模式默认隐藏，?ui=1 时由 main.js 唤出 */
      position: fixed; top: 16px; left: 16px; z-index: 5;
      width: min(320px, calc(100vw - 32px));
      background: rgba(0, 12, 28, 0.72); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.12); border-radius: 16px; padding: 18px;
      color: #e6f7ff; box-shadow: 0 8px 32px rgba(0,0,0,0.35);
      user-select: none; -webkit-user-select: none; touch-action: manipulation;
    }
    #ui h1 { font-size: 16px; font-weight: 600; margin-bottom: 14px; letter-spacing: 0.5px; color: #b3e5fc; }
    .control { margin-bottom: 14px; }
    .control:last-child { margin-bottom: 0; }
    .control label { display: flex; justify-content: space-between; font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; color: #90caf9; margin-bottom: 6px; }
    .control input[type=range] { width: 100%; accent-color: #29b6f6; cursor: pointer; }
    .control .value { color: #e1f5fe; font-weight: 500; }
    .presets { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
    .presets button {
      flex: 1 1 auto; min-width: 78px; padding: 8px 10px; font-size: 12px; font-weight: 600;
      background: rgba(41, 182, 246, 0.16); color: #b3e5fc; border: 1px solid rgba(41, 182, 246, 0.35);
      border-radius: 10px; cursor: pointer; transition: background 0.2s, transform 0.1s;
    }
    .presets button:hover { background: rgba(41, 182, 246, 0.28); }
    .presets button:active { transform: scale(0.96); }

    #fps {
      display: none; /* 壁纸模式默认隐藏，?ui=1 时由 main.js 唤出 */
      position: fixed; top: 16px; right: 16px; z-index: 5;
      font-size: 12px; font-weight: 600; color: #81d4fa;
      background: rgba(0,12,28,0.6); padding: 6px 10px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1); min-width: 64px; text-align: center;
    }

    @media (max-width: 480px) {
      #ui { top: 10px; left: 10px; padding: 14px; width: calc(100vw - 20px); }
      #fps { top: auto; bottom: 16px; right: 16px; }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/tsl": "https://unpkg.com/three@0.160.0/examples/jsm/nodes/Nodes.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div>正在初始化 WebGPU 海洋场景…</div>
  </div>
  <div id="error" class="hidden">
    <div style="font-size:20px;font-weight:700;margin-bottom:8px;">WebGPU 不可用</div>
    <div id="error-text">您的浏览器或设备不支持 WebGPU，请使用最新版 Chrome / Edge / Safari 17+。</div>
  </div>

  <div id="fps">FPS: --</div>
  <div id="ui">
    <h1>OCEAN WALLPAPER</h1>
    <div class="control">
      <label>SEA STATE <span class="value" id="val-sea">1.0</span></label>
      <input type="range" id="sea" min="0" max="2" step="0.01" value="1">
    </div>
    <div class="control">
      <label>TIME OF DAY <span class="value" id="val-time">12:00</span></label>
      <input type="range" id="time" min="0" max="24" step="0.05" value="12">
    </div>
    <div class="control">
      <label>DRIFT <span class="value" id="val-drift">ON</span></label>
      <input type="range" id="drift" min="0" max="1" step="1" value="1">
    </div>
    <div class="presets">
      <button data-preset="day">Day</button>
      <button data-preset="sunset">Sunset</button>
      <button data-preset="night">Starry Night</button>
    </div>
  </div>

  <div id="canvas-container"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
